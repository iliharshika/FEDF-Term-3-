<!DOCTYPE html>
<html>
<head>
    <title>Professional Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .buttons {
            margin-top: 15px;
        }

        button {
            width: 60px;
            height: 45px;
            margin: 5px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #007BFF;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #222;
        }

        .result span {
            font-weight: bold;
            color: #007BFF;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>Calculator</h2>

        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">

        <div class="buttons">
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">-</button><br>
            <button onclick="calculate('*')">*</button>
            <button onclick="calculate('/')">/</button>
        </div>

        <div class="result">
            Result: <span id="result">0</span>
        </div>
    </div>

    <script>
        function calculate(operator) {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let result;

            if (isNaN(num1) || isNaN(num2)) {
                result = "Enter valid numbers";
            } else {
                switch(operator) {
                    case '+': result = num1 + num2; break;
                    case '-': result = num1 - num2; break;
                    case '*': result = num1 * num2; break;
                    case '/': 
                        result = (num2 === 0) ? "Cannot divide by zero" : num1 / num2;
                        break;
                }
            }

            document.getElementById("result").innerText = result;
        }
    </script>

</body>
</html>
